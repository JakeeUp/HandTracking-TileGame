[project]
name = "memory-tiles"
version = "1.1.0"
description = "Webcam memory game controlled with hand pinches (OpenCV + MediaPipe)"
requires-python = ">=3.9,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP006", "UP035"]  # keep typing.List/Optional for Python 3.9
